# AsterraPools production stack on one VPS. Run from infra/ with an .env next to this file (see .env.example).
#   db         Postgres 17 (Supabase image: pg_cron, pg_net, vault, API roles)
#   rest       PostgREST, used by the edge functions through the internal gateway
#   functions  Supabase edge-runtime serving supabase/functions (api, indexer)
#   caddy      public HTTPS (auto Let's Encrypt) + internal Supabase-style gateway on :8000
#   web-*      Next.js builds pulled from GHCR (CI builds them, the VPS never compiles)
name: asterrapools

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.004
    restart: unless-stopped
    logging: *logging
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=warning"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_HOST: /var/run/postgresql
      PGPASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.4
    restart: unless-stopped
    logging: *logging
    depends_on: { db: { condition: service_healthy } }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  functions:
    image: public.ecr.aws/supabase/edge-runtime:v1.77.4
    restart: unless-stopped
    logging: *logging
    depends_on: [rest]
    command: ["start", "--main-service", "/home/deno/main"]
    environment:
      SUPABASE_URL: http://gateway:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY:?set SERVICE_ROLE_KEY}
      INDEXER_TOKEN: ${INDEXER_TOKEN:?set INDEXER_TOKEN}
      FEATURES: ${FEATURES:-}
      EXTERNAL_POOLS: ${EXTERNAL_POOLS:-on}
    volumes:
      - ../supabase/functions:/home/deno/functions:ro
      - ./main:/home/deno/main:ro

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on: [functions]
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
      TESTNET_DOMAIN: ${TESTNET_DOMAIN:-testnet.asterrapools.tech}
      MAINNET_DOMAIN: ${MAINNET_DOMAIN:-asterrapools.tech}
      APEX_UPSTREAM: ${APEX_UPSTREAM:-web-testnet:3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        aliases: [gateway]

  web-testnet:
    image: ghcr.io/asterrapools/asterrapools-web:testnet
    restart: unless-stopped
    logging: *logging
    environment: { PORT: "3000", HOSTNAME: 0.0.0.0 }

  web-mainnet:
    image: ghcr.io/asterrapools/asterrapools-web:mainnet
    restart: unless-stopped
    logging: *logging
    profiles: [mainnet]
    environment: { PORT: "3000", HOSTNAME: 0.0.0.0 }

volumes:
  db-data:
  caddy-data:
  caddy-config:
